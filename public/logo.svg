<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bgGradient)" />
  
  <!-- Subtle inner shadow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#innerGlow)" opacity="0.3" />
  
  <!-- Medical cross - vertical bar -->
  <rect x="220" y="100" width="72" height="220" rx="10" fill="white" />
  
  <!-- Medical cross - horizontal bar -->
  <rect x="146" y="174" width="220" height="72" rx="10" fill="white" />
  
  <!-- Clipboard/document icon below cross -->
  <rect x="176" y="340" width="160" height="100" rx="8" fill="white" opacity="0.9" />
  <rect x="220" y="330" width="72" height="20" rx="6" fill="white" />
  
  <!-- Document lines -->
  <rect x="196" y="365" width="120" height="6" rx="3" fill="#1e40af" opacity="0.5" />
  <rect x="196" y="381" width="90" height="6" rx="3" fill="#1e40af" opacity="0.4" />
  <rect x="196" y="397" width="105" height="6" rx="3" fill="#1e40af" opacity="0.3" />
  <rect x="196" y="413" width="70" height="6" rx="3" fill="#1e40af" opacity="0.3" />
  
  <!-- Text label -->
  <text x="256" y="480" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="32" letter-spacing="6" opacity="0.9">СМУ</text>
  
  <!-- Gradient definitions -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="256" y1="16" x2="256" y2="496" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>
  </defs>
</svg>
